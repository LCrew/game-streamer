name: Build

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build-push-and-release:
    runs-on: ubuntu-latest
    steps:
      # ghcr rejects a tag whose repository part has capitals, and
      # github.repository_owner preserves the case of the org. Upstream never
      # trips this because "5stackgg" is already lowercase; a fork whose owner
      # is not (LCrew, say) fails every build-push with "repository name must
      # be lowercase". Per-job because GITHUB_ENV does not cross jobs, and
      # tr rather than ${VAR,,} so the same line is testable off-runner.
      - name: Lowercase the owner for image refs
        run: |
          echo "OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/game-streamer:latest
            ghcr.io/${{ env.OWNER }}/game-streamer:${{ github.sha }}
          # Registry-backed cache: a dedicated :buildcache tag on ghcr stores
          # the layer cache across runs (no 10GB GHA-cache ceiling, survives
          # branch/PR boundaries). First build is a full rebuild; every
          # subsequent build reuses unchanged apt/steamcmd/CS2 layers.
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.OWNER }}/game-streamer:buildcache
          cache-to: |
            type=registry,ref=ghcr.io/${{ env.OWNER }}/game-streamer:buildcache,mode=max

      - name: Delete Package Versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: game-streamer
          package-type: container
          min-versions-to-keep: 8
          ignore-versions: '^buildcache-*'
